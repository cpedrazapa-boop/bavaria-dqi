<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Bavaria - Novedades DQI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FBF8F8;--surface:#fff;--border:#EDD5D5;--border2:#DDB8B8;
  --text:#1a0808;--text2:#6b3333;--text3:#9b7070;
  --blue:#E30613;--blue-bg:#FDECEC;--blue-text:#9E0000;
  --green:#3B6D11;--green-bg:#EAF3DE;
  --red:#C8A84B;--red-bg:#FDF5E0;--red-text:#7A6020;
  --amber:#C8A84B;--amber-bg:#FDF5E0;--amber-text:#7A6020;
  --purple:#8B0000;--purple-bg:#FDEAEA;--purple-text:#6B0000;
  --gray-bg:#D3D1C7;--gray-text:#444441;
  --teal:#0D7E6E;--teal-bg:#E0F5F2;
  --bav-red:#E30613;--bav-gold:#C8A84B;
  --radius:12px;--radius-sm:8px}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.role-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.role-card{background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--bav-gold);border-radius:var(--radius);padding:28px 24px;width:100%;max-width:360px}
.role-logo{font-size:20px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.role-sub{font-size:13px;color:var(--text2);margin-bottom:24px}
.role-btn{width:100%;padding:13px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer;display:flex;align-items:center;gap:12px;margin-bottom:10px;text-align:left}
.role-btn:active{background:var(--bg)}
.role-btn:hover{border-color:var(--bav-gold)}
.role-icon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.role-name{font-size:14px;font-weight:600;color:var(--text)}
.role-desc{font-size:11px;color:var(--text2);margin-top:2px}
.topbar{background:var(--surface);border-bottom:3px solid var(--bav-red);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:54px;position:sticky;top:0;z-index:50}
.topbar-left{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden}
.topbar-title{font-size:15px;font-weight:700}
.role-tag{font-size:11px;color:var(--text2);background:var(--bg);padding:2px 10px;border-radius:20px;border:1px solid var(--border);white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--text2);padding:8px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.notif-panel{display:none;position:fixed;top:54px;right:8px;z-index:200;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:14px;width:290px;max-height:320px;overflow-y:auto;box-shadow:0 4px 20px rgba(0,0,0,.12)}
.notif-item{padding:8px 0;border-bottom:1px solid var(--border)}
.notif-item:last-child{border-bottom:none}
.notif-msg{font-size:13px;color:var(--text)}.notif-ts{font-size:11px;color:var(--text3);margin-top:2px}
.bottom-nav{display:none}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-size:10px;color:var(--text2);border:none;background:none;padding:8px 0;position:relative}
.nav-tab.active{color:var(--bav-red)}.nav-tab i{font-size:22px}
.nav-badge{position:absolute;top:6px;right:calc(50% - 20px);background:var(--bav-red);color:#fff;font-size:9px;border-radius:10px;padding:1px 5px;font-weight:700;display:none}
.content{padding:16px;padding-bottom:24px}
.section-title{font-size:16px;font-weight:700;margin-bottom:14px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.stat-num{font-size:26px;font-weight:700}.stat-label{font-size:11px;color:var(--text2);margin-top:2px}
.nov-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer;-webkit-tap-highlight-color:rgba(0,0,0,.05)}
.nov-card:active{background:var(--bg)}
.nov-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.nov-id{font-size:11px;color:var(--text3);font-family:monospace}
.pill{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;white-space:nowrap}
.s-pendiente{background:var(--amber-bg);color:var(--amber)}
.s-aprobado_bavaria{background:#FDECEC;color:var(--bav-red)}
.s-aprobado_facturacion{background:var(--green-bg);color:var(--green)}
.s-rechazado{background:var(--red-bg);color:var(--red)}
.s-en_ol{background:var(--teal-bg);color:var(--teal)}
.s-en_almacen{background:var(--purple-bg);color:var(--purple)}
.s-cerrado{background:var(--gray-bg);color:var(--gray-text)}
.nov-cliente{font-size:15px;font-weight:600}
.nov-meta{font-size:12px;color:var(--text2);margin-top:4px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.mtag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--amber-bg);color:var(--amber)}
.nov-sub{font-size:11px;color:var(--text3);margin-top:3px}
.fsec{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.fsec-t{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
.fg{margin-bottom:14px}
label{font-size:13px;font-weight:600;color:var(--text2);display:block;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:15px;font-family:inherit;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--bav-red)}
input[readonly]{background:var(--blue-bg);color:var(--blue-text);font-weight:600}
textarea{resize:vertical;min-height:72px}
.req{color:var(--red);margin-left:2px}
.sku-ok{margin-top:8px;padding:10px 12px;background:var(--green-bg);border:1px solid #C0DD97;border-radius:var(--radius-sm);display:none}
.sku-ok-n{font-weight:700;color:#27500A;font-size:13px}.sku-ok-f{color:var(--green);font-size:12px;margin-top:2px}
.sku-err{margin-top:8px;padding:8px 12px;background:var(--red-bg);border:1px solid #F7C1C1;border-radius:var(--radius-sm);font-size:13px;color:var(--red);display:none}
.mg{display:flex;flex-direction:column;gap:8px}
.mi{display:flex;align-items:center;gap:12px;padding:12px;border:2px solid var(--border);border-radius:var(--radius-sm);cursor:pointer}
.mi.sel{border-color:var(--blue);background:var(--blue-bg)}
.mi input[type=radio]{width:18px;height:18px;flex-shrink:0;accent-color:var(--blue)}
.mi label{font-size:14px;font-weight:500;cursor:pointer;margin:0;color:var(--text)}
.toggle-row{display:flex;gap:10px;margin-top:6px}
.toggle-opt{flex:1;padding:12px;border:2px solid var(--border);border-radius:var(--radius-sm);text-align:center;cursor:pointer;font-size:15px;font-weight:600;color:var(--text2)}
.toggle-opt.sel-si{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.toggle-opt.sel-no{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.btn{width:100%;padding:14px;border-radius:var(--radius-sm);font-size:15px;font-weight:700;cursor:pointer;border:none;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{opacity:.8}
.btn-p{background:var(--bav-red);color:#fff}.btn-s{background:var(--green);color:#fff}.btn-d{background:var(--red);color:#fff}.btn-t{background:var(--teal);color:#fff}
.bcol{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.brow{display:flex;gap:10px;margin-top:16px}.brow .btn{flex:1}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;overflow-y:auto;padding:20px 0;display:none}
.modal-box{background:var(--surface);border-radius:var(--radius);margin:auto;width:calc(100% - 32px);max-width:560px;padding:20px 16px 32px;position:relative}
.modal-close{position:absolute;top:16px;right:16px;background:var(--bg);border:1px solid var(--border);border-radius:50%;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text2)}
.fr{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border)}
.fr:last-child{border-bottom:none}
.fk{font-size:13px;color:var(--text2);flex-shrink:0;margin-right:12px}
.fv{font-size:13px;font-weight:600;text-align:right;max-width:65%;word-break:break-word}
.hdiv{height:1px;background:var(--border);margin:16px 0}
.tli{display:flex;gap:12px;margin-bottom:14px}
.tld{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px}
.cv{background:var(--green)}.cr{background:var(--red)}.cn{background:var(--amber)}.cm{background:var(--purple)}.ca{background:var(--blue)}.ct{background:var(--teal)}
.tla{font-size:13px;font-weight:600}.tlm{font-size:12px;color:var(--text2)}.tln{font-size:12px;color:var(--text2);margin-top:2px;font-style:italic}
.stps{display:flex;align-items:center;gap:4px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.stp{font-size:10px;padding:4px 8px;border-radius:20px;background:var(--bg);color:var(--text2);border:1px solid var(--border);white-space:nowrap}
.stp.done{background:var(--green-bg);color:var(--green);border-color:#C0DD97}
.stp.active{background:var(--blue-bg);color:var(--blue-text);border-color:#B5D4F4;font-weight:700}
.stp.blocked{background:var(--red-bg);color:var(--red);border-color:#F7C1C1}
.sarr{font-size:12px;color:var(--text3)}
.empty{text-align:center;padding:48px 20px;color:var(--text2);font-size:14px}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
/* DASHBOARD REPORTES */
.rdb-wrap{padding:0 0 32px}
.rdb-period{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.rdb-period-btn{padding:7px 16px;border:1.5px solid var(--border2);border-radius:20px;background:var(--surface);font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s}
.rdb-period-btn.active{background:var(--bav-red);color:#fff;border-color:var(--bav-red)}
.rdb-dates{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.rdb-dates label{font-size:12px;color:var(--text2);margin:0}
.rdb-dates input{width:auto;padding:6px 10px;font-size:13px;border-radius:var(--radius-sm);border:1px solid var(--border2)}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi-red::before{background:var(--bav-red)}
.kpi-gold::before{background:var(--bav-gold)}
.kpi-green::before{background:var(--green)}
.kpi-blue::before{background:#185FA5}
.kpi-icon{font-size:22px;margin-bottom:6px}
.kpi-val{font-size:28px;font-weight:800;line-height:1;color:var(--text)}
.kpi-lbl{font-size:11px;color:var(--text2);margin-top:4px;font-weight:500}
.kpi-sub{font-size:10px;color:var(--text3);margin-top:2px}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.chart-card-full{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:16px}
.chart-title{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
.rdb-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
.rdb-table-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)}
.rdb-table-title{font-size:13px;font-weight:700;color:var(--text)}
.btn-export{display:flex;align-items:center;gap:6px;padding:7px 14px;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer}
.rdb-table{width:100%;border-collapse:collapse;font-size:12px}
.rdb-table th{background:var(--bg);color:var(--text2);font-weight:700;padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
.rdb-table td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
.rdb-table tr:last-child td{border-bottom:none}
.rdb-table tr:hover td{background:var(--bg)}
.rdb-scroll{overflow-x:auto}
.foto-viewer{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:999;display:none;align-items:center;justify-content:center;flex-direction:column}
.foto-viewer img{max-width:100%;max-height:85vh;object-fit:contain;border-radius:8px}
.foto-viewer-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.2);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.foto-viewer-nav{display:flex;gap:16px;margin-top:16px}
.foto-viewer-nav button{background:rgba(255,255,255,.2);border:none;color:#fff;padding:8px 20px;border-radius:20px;font-size:14px;cursor:pointer}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border2);background:transparent;transition:background .15s}
.pin-dot.filled{background:var(--bav-red);border-color:var(--bav-red)}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:220px;margin:0 auto}
.pin-btn{padding:16px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--surface);font-size:20px;font-weight:600;cursor:pointer;color:var(--text);transition:background .1s}
.pin-btn:active{background:var(--bg)}
.pin-clear{font-size:18px;color:var(--text2)}
.pin-ok{background:var(--bav-red);color:#fff;border-color:var(--bav-red);font-size:18px}
.pin-ok:active{opacity:.8}
.user-btn{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer;text-align:left;width:100%;transition:border-color .15s}
.user-btn:hover{border-color:var(--bav-gold)}
.user-btn:active{background:var(--bg)}
.user-avatar{width:38px;height:38px;border-radius:50%;background:var(--bav-red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0}
.user-name{font-size:14px;font-weight:600;color:var(--text)}
.user-rol{font-size:11px;color:var(--text2);margin-top:2px}
.foto-zone{border:2px dashed var(--border2);border-radius:var(--radius-sm);padding:20px;text-align:center;cursor:pointer;margin-top:8px;transition:border-color .15s}
.foto-zone:hover{border-color:var(--bav-red)}
.foto-zone i{font-size:32px;color:var(--text3);display:block;margin-bottom:6px}
.foto-zone p{font-size:13px;color:var(--text2)}
.foto-zone small{font-size:11px;color:var(--text3)}
.foto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.foto-item{position:relative;aspect-ratio:1;border-radius:var(--radius-sm);overflow:hidden;background:var(--bg)}
.foto-item img{width:100%;height:100%;object-fit:cover}
.foto-del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.foto-thumb{border-radius:var(--radius-sm);overflow:hidden;aspect-ratio:1;cursor:pointer;display:inline-block}
.foto-thumb img{width:100%;height:100%;object-fit:cover}
.ev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.dash-header{display:flex;align-items:center;gap:14px;margin-bottom:20px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.dash-role-icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.dash-bienvenida{font-size:12px;color:var(--text2);margin-bottom:2px}
.dash-rolename{font-size:17px;font-weight:700;color:var(--text)}
.dash-alert{background:var(--amber-bg);border:1px solid #F0C97A;border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--amber);display:flex;align-items:center;gap:8px}
.dash-actions{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.dash-action-btn{flex:1;min-width:140px;padding:14px 12px;border:1.5px solid var(--border2);border-radius:var(--radius);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text2);position:relative;transition:all .15s}
.dash-action-btn:active{opacity:.8}
.dash-action-btn i{font-size:24px}
.dash-action-btn.primary{background:var(--bav-red);color:#fff;border-color:var(--bav-red)}
.dash-action-btn.primary i{color:#fff}
.dash-badge{position:absolute;top:8px;right:8px;background:#E24B4A;color:#fff;font-size:10px;border-radius:10px;padding:1px 6px;font-weight:700}
.dash-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
.dash-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 8px;text-align:center;cursor:pointer;transition:border-color .15s}
.dash-stat:hover{border-color:var(--border2)}
.dash-stat.warn{border-left:3px solid var(--bav-gold)}
.dash-stat.info{border-left:3px solid var(--blue)}
.dash-stat.ok{border-left:3px solid var(--green)}
.dash-stat-num{font-size:22px;font-weight:700}
.dash-stat-label{font-size:10px;color:var(--text2);margin-top:2px}
.dash-section-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.dash-pend-dot{width:8px;height:8px;background:var(--bav-red);border-radius:50%;flex-shrink:0;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.dash-nov-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--bav-red);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.dash-nov-card:hover{border-color:var(--amber)}
.dash-nov-card:active{background:var(--bg)}
.dash-ver-mas{text-align:center;padding:10px;font-size:13px;color:var(--blue);cursor:pointer;font-weight:600}
.dash-empty{text-align:center;padding:32px 20px;color:var(--text2);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.dash-empty i{font-size:40px;color:var(--green);display:block;margin-bottom:8px}
.fdate-btn{padding:6px 14px;border:1px solid var(--border2);border-radius:20px;background:var(--surface);font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap}
.fdate-btn:active{background:var(--bg)}
.fdate-btn.active{background:var(--bav-red);color:#fff;border-color:var(--bav-red)}
.frow2{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.frow2 select{width:auto;font-size:13px;padding:7px 10px}
.ibox{background:var(--blue-bg);border:1px solid #B5D4F4;border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:14px;font-size:13px;color:var(--blue-text)}
.wbox{background:var(--amber-bg);border:1px solid #F0C97A;border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:14px;font-size:13px;color:var(--amber)}
.gbox{background:var(--teal-bg);border:1px solid #9FD8D2;border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:14px;font-size:13px;color:var(--teal)}

function addN(roles,msg,id){
  roles.forEach(function(r){
    if(!notifs[r])notifs[r]=[];
    notifs[r].unshift({msg:msg,id:id,ts:ts(),read:false});
    if(notifs[r].length>30)notifs[r].pop();
  });
  saveN();
}

var usuarios=[], usuarioActual=null, pinIngresado='';

function cargarUsuarios(){
  if(!window._ready){window.addEventListener('firebaseReady',cargarUsuarios);return;}
  window._snap(window._col(window._db,'usuarios'),function(snap){
    usuarios=snap.docs.map(function(d){return Object.assign({},d.data(),{_id:d.id});});
    renderUserList();
  });
}

var ROLE_ICONS={ruta:'ti-route',bavaria:'ti-building-warehouse',facturacion:'ti-receipt',ol:'ti-package',facturacion_ol:'ti-arrows-exchange',verificador:'ti-eye'};
var ROLE_COLORS={ruta:'var(--amber)',bavaria:'var(--bav-red)',facturacion:'var(--green)',ol:'var(--teal)',facturacion_ol:'var(--purple)',verificador:'var(--gray-text)'};

function renderUserList(){
  var ul=document.getElementById('userList'); if(!ul)return;
  if(!usuarios.length){
    ul.innerHTML='<div style="text-align:center;padding:20px;font-size:13px;color:var(--text2)">No hay usuarios registrados.<br>Agrega usuarios en Firebase → Coleccion <strong>usuarios</strong></div>';
    return;
  }
  ul.innerHTML=usuarios.map(function(u){
    var ini=(u.nombre||'?')[0].toUpperCase();
    var color=ROLE_COLORS[u.rol]||'var(--bav-red)';
    return '<button class="user-btn" data-uid="'+u._id+'">'+
      '<div class="user-avatar" style="background:'+color+'">'+ini+'</div>'+
      '<div><div class="user-name">'+u.nombre+'</div><div class="user-rol">'+(RL[u.rol]||u.rol)+'</div></div>'+
    '</button>';
  }).join('');
  ul.querySelectorAll('.user-btn').forEach(function(btn){
    btn.onclick=function(){
      var uid=this.getAttribute('data-uid');
      var u=usuarios.find(function(x){return x._id===uid;});
      if(u) mostrarPIN(u);
    };
  });
}

function mostrarPIN(u){
  usuarioActual=u; pinIngresado='';
  document.getElementById('loginStep1').style.display='none';
  document.getElementById('loginStep2').style.display='block';
  document.getElementById('loginAvatar').textContent=(u.nombre||'?')[0].toUpperCase();
  document.getElementById('loginAvatar').style.background=ROLE_COLORS[u.rol]||'var(--bav-red)';
  document.getElementById('loginNombre').textContent=u.nombre;
  document.getElementById('loginRolLabel').textContent=RL[u.rol]||u.rol;
  document.getElementById('pinError').style.display='none';
  actualizarDots();
}

function actualizarDots(){
  document.querySelectorAll('.pin-dot').forEach(function(d,i){
    d.classList.toggle('filled', i<pinIngresado.length);
  });
}

document.addEventListener('click',function(e){
  var pb=e.target.closest('.pin-btn[data-n]');
  if(pb&&pinIngresado.length<4){
    pinIngresado+=pb.getAttribute('data-n');
    actualizarDots();
    if(pinIngresado.length===4) setTimeout(verificarPIN,100);
  }
  var pc=e.target.closest('#pinClear');
  if(pc){pinIngresado=pinIngresado.slice(0,-1);actualizarDots();}
  var po=e.target.closest('#pinOk');
  if(po) verificarPIN();
  var bl=e.target.closest('#btnBackLogin');
  if(bl){
    document.getElementById('loginStep2').style.display='none';
    document.getElementById('loginStep1').style.display='block';
    pinIngresado=''; usuarioActual=null;
  }
});

function verificarPIN(){
  if(!usuarioActual) return;
  if(pinIngresado===String(usuarioActual.pin)){
    document.getElementById('pinError').style.display='none';
    selRole(usuarioActual.rol, usuarioActual.nombre);
  } else {
    document.getElementById('pinError').style.display='block';
    pinIngresado=''; actualizarDots();
    setTimeout(function(){document.getElementById('pinError').style.display='none';},2000);
  }
}

// Global delegated click handler for back buttons and cards
document.getElementById('contentArea').addEventListener('click', function(e){
  var ft=e.target.closest('.foto-thumb[data-fi]');
  if(ft){
    var nid=ft.getAttribute('data-nid');
    var fi=+ft.getAttribute('data-fi');
    var arrName=ft.getAttribute('data-arr')||'fotos';
    var nov=novs.find(function(x){return x._id===nid;});
    if(nov&&nov[arrName]&&nov[arrName].length){
      abrirViewer(nov[arrName], fi);
    }
    return;
  }
  var repBtn=e.target.closest('#dashBtnRep');
  if(repBtn){reportesV(document.getElementById('contentArea'));return;}
  var backupBtn=e.target.closest('#btnBackupAll');
  if(backupBtn){exportarBackup();return;}
  // Dashboard date filters
  var dfBtn=e.target.closest('#dashFHoy,#dashFSem,#dashFMes,#dashFTodo');
  if(dfBtn){
    document.querySelectorAll('#dashFHoy,#dashFSem,#dashFMes,#dashFTodo').forEach(function(b){b.classList.remove('active');});
    dfBtn.classList.add('active');
    var hoy2=new Date(); hoy2.setHours(0,0,0,0); var hoyT=hoy2.getTime();
    if(dfBtn.id==='dashFHoy'){
      // Today - use cached
      novs=(window._allNovs||novs).filter(function(n){return !n.creadoEn||n.creadoEn>=hoyT;});
      refr('dashboard');
    } else if(dfBtn.id==='dashFSem'){
      // This week - load from server
      mostrarToast('Cargando semana...');
      var lu=new Date(hoy2); lu.setDate(hoy2.getDate()-hoy2.getDay()+1);
      cargarRango(lu.getTime(), function(){ refr('dashboard'); mostrarToast(novs.length+' registros de la semana'); });
    } else if(dfBtn.id==='dashFMes'){
      // This month - load from server
      mostrarToast('Cargando mes...');
      var pm=new Date(hoy2.getFullYear(),hoy2.getMonth(),1);
      cargarRango(pm.getTime(), function(){ refr('dashboard'); mostrarToast(novs.length+' registros del mes'); });
    } else {
      // ALL - load from server with spinner
      mostrarToast('Cargando historial completo...');
      cargarRango(0, function(){ refr('dashboard'); mostrarToast('Total: '+novs.length+' registros'); });
    }
    return;
  }
  var bb=e.target.closest('#btnBackDash,#btnBackDashForm');
  if(bb){showV('dashboard');return;}
  var nc=e.target.closest('.nov-card[data-novid],.dash-nov-card[data-novid]');
  if(nc){abrirNov(nc.getAttribute('data-novid'));return;}
  var vm=e.target.closest('#dashVerMas,#dashBtnNovs,#dashBtnNovs2,#dashBtnNovs3');
  if(vm){showV('novedades');return;}
  var rp=e.target.closest('#dashBtnReportar');
  if(rp){showV('reportar');return;}
  var pd=e.target.closest('#dashBtnPend');
  if(pd){verPendientes();return;}
  var st=e.target.closest('#dashStatTot');  if(st){filtrarYver('');return;}
  var sp=e.target.closest('#dashStatPen');  if(sp){filtrarYver('pendiente');return;}
  var spr=e.target.closest('#dashStatProc');if(spr){filtrarYver('en_ol');return;}
  var sc=e.target.closest('#dashStatCerr'); if(sc){filtrarYver('cerrado');return;}
});

function startL(){
  if(!window._ready) return;
  if(unsub) unsub();

  // Show loading with progress
  var ca=document.getElementById('contentArea');
  if(ca&&novs.length===0){
    ca.innerHTML=
      '<div style="text-align:center;padding:48px 20px">'+
        '<div style="width:56px;height:56px;border:4px solid var(--border2);border-top-color:var(--bav-red);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px"></div>'+
        '<div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:8px">Conectando con Bavaria DQI...</div>'+
        '<div style="font-size:13px;color:var(--text2);margin-bottom:20px" id="loadMsg">Iniciando conexión segura</div>'+
        '<div style="background:var(--border);border-radius:10px;height:6px;width:200px;margin:0 auto;overflow:hidden">'+
          '<div id="loadBar" style="height:100%;background:var(--bav-red);border-radius:10px;width:0%;transition:width 0.5s ease"></div>'+
        '</div>'+
        '<div style="font-size:11px;color:var(--text3);margin-top:8px" id="loadCount"></div>'+
      '</div>';
    // Animate loading bar
    setTimeout(function(){var b=document.getElementById('loadBar');if(b)b.style.width='20%';var m=document.getElementById('loadMsg');if(m)m.textContent='Verificando credenciales...';},300);
    setTimeout(function(){var b=document.getElementById('loadBar');if(b)b.style.width='50%';var m=document.getElementById('loadMsg');if(m)m.textContent='Cargando registros de hoy...';},800);
    setTimeout(function(){var b=document.getElementById('loadBar');if(b)b.style.width='75%';},1500);
  }

  // SERVER-SIDE filter: only load today's records from Firebase
  var hoyDate=new Date();
  hoyDate.setHours(0,0,0,0);
  var hoyTs=hoyDate.getTime();
  var q50=window._q(
    window._col(window._db,'novedades'),
    window._where('creadoEn','>=',hoyTs),
    window._ord('creadoEn','desc')
  );
  var unsubFast=window._snap(q50,function(snap){
    novs=snap.docs.map(function(d){var data=d.data();var light=Object.assign({},data,{_id:d.id});delete light.fotos;delete light.fotosOL;delete light.fotosEntrega;light._hasFotos=!!(data.fotos&&data.fotos.length||data.fotosOL&&data.fotosOL.length||data.fotosEntrega&&data.fotosEntrega.length);light._fotosLoaded=false;return light;});
    // Update progress bar
    var b=document.getElementById('loadBar'); if(b) b.style.width='85%';
    var m=document.getElementById('loadMsg'); if(m) m.textContent='Cargando vista inicial...';
    var ct=document.getElementById('loadCount'); if(ct) ct.textContent=novs.length+' registros recientes listos';
    setTimeout(function(){
      var cur=document.querySelector('.nav-tab.active');
      if(cur){var v=cur.id.replace('tab-',''); if(v!=='reportar') refr(v);}
      badge();
      unsubFast();

      // Now load ALL records in background with progress
      var qAll=window._q(window._col(window._db,'novedades'),window._ord('creadoEn','desc'));
      unsub=window._snap(qAll,function(snapAll){
        var prev=novs.length;
        var allNovs=snapAll.docs.map(function(d){var data=d.data();var light=Object.assign({},data,{_id:d.id});delete light.fotos;delete light.fotosOL;delete light.fotosEntrega;light._hasFotos=!!(data.fotos&&data.fotos.length||data.fotosOL&&data.fotosOL.length||data.fotosEntrega&&data.fotosEntrega.length);light._fotosLoaded=false;return light;});
        // Default view: today only from 7-day cache
        var todayStart2=new Date(); todayStart2.setHours(0,0,0,0);
        novs=allNovs.filter(function(n){return !n.creadoEn||n.creadoEn>=todayStart2.getTime();});
        window._allNovs=allNovs;
        // Show toast if more records loaded
        if(novs.length>prev){
          mostrarToast('Semana cargada: '+novs.length+' registros');
        }
        var cur2=document.querySelector('.nav-tab.active');
        if(cur2){var v2=cur2.id.replace('tab-',''); if(v2!=='reportar') refr(v2);}
        badge();
        if(currentNovId){
          var n=novs.find(function(x){return x._id===currentNovId;});
          if(n) renderModal(n);
        }
      });
    },400);
  });
}

function stpHtml(n){

  var mapC={pendiente:0,aprobado_bavaria:1,aprobado_facturacion:1,rechazado:-1,en_almacen:1,en_ol:2,cerrado:3};
  var mapN={pendiente:0,aprobado_bavaria:1,aprobado_facturacion:1,rechazado:-1,en_almacen:1,en_ol:2,cerrado:3};

function setFecha(btn,periodo){
  document.querySelectorAll('.fdate-btn').forEach(function(b){b.classList.remove('active');});
  if(btn) btn.classList.add('active');
  var hoy=new Date();
  var desde=document.getElementById('fdDesde');
  var hasta=document.getElementById('fdHasta');
  if(!desde||!hasta) return;
  var h=hoy.toISOString().split('T')[0];
  if(periodo==='hoy'){
    desde.value=h; hasta.value=h;
  } else if(periodo==='semana'){
    var lunes=new Date(hoy);
    lunes.setDate(hoy.getDate()-hoy.getDay()+1);
    desde.value=lunes.toISOString().split('T')[0];
    hasta.value=h;
  } else if(periodo==='mes'){
    var primeroDia=new Date(hoy.getFullYear(),hoy.getMonth(),1);
    desde.value=primeroDia.toISOString().split('T')[0];
    hasta.value=h;
  } else if(periodo==='todo'){
    desde.value=''; hasta.value='';
  }
  applyF();
}

function applyF(){
  var filt=document.getElementById('filt'); var val=filt?filt.value:'';
  // Base list filtered by role
  var base=(window._allNovs&&window._allNovs.length)?window._allNovs:novs;
  if(isOL()){
    // OL only sees aprobadas (pendientes de despachar) and en_ol and cerradas
    base=novs.filter(function(n){return ['aprobado_bavaria','aprobado_facturacion','en_ol','cerrado'].includes(n.estado);});
  }
  var fil=val?base.filter(function(n){return n.estado===val;}):base;
  // Facturacion only sees their motivos when filtering pendiente
  if(isF()&&val==='pendiente'){
    fil=fil.filter(function(n){return MOT_FACT.includes(getMot(n));});
  }
  // Bavaria only sees their motivos when filtering pendiente
  if(isB()&&val==='pendiente'){
    fil=fil.filter(function(n){return MOT_BAV.includes(getMot(n));});
  }

  // Filtro de fecha para Verificador
  if(isVerif()){
    var desde=document.getElementById('fdDesde');
    var hasta=document.getElementById('fdHasta');
    if(desde&&hasta&&desde.value){
      var dDesde=desde.value;
      var dHasta=hasta.value||desde.value;
      fil=fil.filter(function(n){
        var ts=n.creadoEn;
        if(ts){
          var d=new Date(ts);
          var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
          return ds>=dDesde&&ds<=dHasta;
        }
        return true;
      });
    }
  }

  var c=document.getElementById('lista');
  var cont=document.getElementById('conteo');
  if(cont) cont.textContent=fil.length+' novedad'+(fil.length!==1?'es':'');
  if(c) c.innerHTML=fil.length?fil.map(card).join(''):'<div class="empty">Sin resultados para este per&iacute;odo</div>';
}

// ── MODAL ──────────────────────────────────────────────
function abrirNov(id){
  var n=novs.find(function(x){return x._id===id;}); if(!n)return;
  currentNovId=id;
  renderModal(n);
  document.getElementById('modalOv').style.display='block';
  document.getElementById('modalOv').scrollTop=0;
  // Lazy load fotos using Firebase SDK
  if(n._hasFotos&&!n._fotosLoaded){
    var docRef=window._doc(window._db,'novedades',id);
    window._getDocs(window._q(window._col(window._db,'novedades'),window._where('__name__','==',docRef))).then(function(snap){
      if(snap.docs.length){
        var data=snap.docs[0].data();
        n.fotos=data.fotos||[];
        n.fotosOL=data.fotosOL||[];
        n.fotosEntrega=data.fotosEntrega||[];
        n._fotosLoaded=true;
        if(currentNovId===id) renderModal(n);
      }
    }).catch(function(e){console.log('Foto load error:',e);});
  }
}

  document.getElementById('modalOv').style.display='none';

}

async function validar(fid,mot,dec){
  var com=document.getElementById('mCom')?document.getElementById('mCom').value.trim():'';
  if(dec==='rechazado'&&!com){alert('Escribe el motivo del rechazo.');return;}
  var n=novs.find(function(x){return x._id===fid;}); if(!n)return;
  var nuevoEst=dec==='rechazado'?'rechazado':getEstAprobado(mot);
  var quien=RL[role];
  var tl=(n.tl||[]).concat([{a:dec==='rechazado'?('Rechazado por '+quien):('Aprobado por '+quien),por:quien,ts:ts(),n:com,c:dec==='rechazado'?'rojo':'verde'}]);
  var upd={estado:nuevoEst,tl:tl}; if(dec==='rechazado')upd.motivoRechazo=com;
  try{
    await window._upd(window._doc(window._db,'novedades',fid),upd);
    if(dec==='rechazado'){
      addN([n.supervisorUsername],'Novedad '+n.id+' rechazada por '+quien+': '+com,n.id);
    } else {
      addN([n.supervisorUsername],'Novedad '+n.id+' ('+n.cliente+') aprobada por '+quien,n.id);
      addN(['ol'],'Novedad '+n.id+' aprobada por '+quien+' - despacha el producto para '+n.cliente,n.id);
      if(role==='facturacion') addN(['bavaria'],'Facturacion aprobo novedad '+n.id+' ('+getMot(n)+') - '+n.cliente,n.id);
    }
    closeModal();
  }catch(e){alert('Error: '+e.message);}
}

// despachar eliminado - OL es quien despacha

async function olEntregaRuta(fid,supRole,cliente){
  var rem=document.getElementById('mRem')?document.getElementById('mRem').value.trim():'';
  var nota=document.getElementById('mOLnota')?document.getElementById('mOLnota').value.trim():'';
  if(!rem){alert('Ingresa la placa del vehiculo.');return;}
  var n=novs.find(function(x){return x._id===fid;}); if(!n)return;
  var tl=(n.tl||[]).concat([{a:'OL entrego producto al Supervisor de Ruta',por:RL[role],ts:ts(),n:'Placa: '+rem+(nota?' | Recibe: '+nota:''),c:'teal'}]);
  var upd={estado:'en_ol',placaDespacho:rem,personaRecibe:nota,tl:tl};
  if(fotosModal.length) upd.fotosOL=fotosModal.slice();
  try{
    await window._upd(window._doc(window._db,'novedades',fid),upd);
    addN([supRole],'OL despacho el producto para '+cliente+' (Rem: '+rem+'). Entregáselo al cliente y cierra la novedad.',n.id);
    addN(['bavaria'],'OL despacho producto al Supervisor de Ruta - novedad '+n.id+' ('+cliente+')',n.id);
    addN(['facturacion'],'OL despacho producto - novedad '+n.id+' ('+cliente+')',n.id);
    closeModal();
  }catch(e){alert('Error: '+e.message);}
}

async function cerrar(fid,cliente){
  var sop=document.getElementById('mSop')?document.getElementById('mSop').value.trim():'';
  if(!sop){alert('Ingresa el soporte de recibido del cliente.');return;}
  var n=novs.find(function(x){return x._id===fid;}); if(!n)return;
  var tl=(n.tl||[]).concat([{a:'Entregado al cliente y novedad cerrada',por:RL[role],ts:ts(),n:'Soporte: '+sop,c:'verde'}]);
  var upd={estado:'cerrado',soporteCliente:sop,tl:tl};
  if(fotosModal.length) upd.fotosEntrega=fotosModal.slice();
  try{
    await window._upd(window._doc(window._db,'novedades',fid),upd);
    addN(['bavaria'],'Novedad '+n.id+' cerrada. Entregado a '+cliente+'.',n.id);
    addN(['facturacion'],'Novedad '+n.id+' cerrada con soporte del cliente.',n.id);
    if(esCambio(n)) addN(['ol'],'Novedad '+n.id+' cerrada. El cliente recibi\u00f3 el cambio.',n.id);
    closeModal();
  }catch(e){alert('Error: '+e.message);}
}

function wireSku(n){

function skuLN(v,n){
  v=v.trim();
  var ok=document.getElementById('sOk'+n),err=document.getElementById('sErr'+n),pr=document.getElementById('fPr'+n);
  if(!ok||!err||!pr) return;
  ok.style.display='none'; err.style.display='none'; pr.value='';
  if(!v) return;
  var f=SKUS[v];
  if(f){document.getElementById('sNom'+n).textContent=f.nombre;document.getElementById('sFam'+n).textContent='Familia: '+f.familia;pr.value=f.nombre;ok.style.display='block';}
  else if(v.length>=3){err.style.display='block';}
}

// Modal photo state
var fotosModal=[];

function wiredFotos(zoneId, inputId, gridId, arrName){
  var arr = arrName==='fotosModal' ? fotosModal : fotos;
  var zone=document.getElementById(zoneId);
  var input=document.getElementById(inputId);
  if(!zone||!input) return;
  zone.onclick=function(){input.click();};
  input.onchange=function(e){
    var restantes=3-arr.length;
    if(restantes<=0){alert('Máximo 3 fotos.');return;}
    var files=Array.from(e.target.files).slice(0,restantes);
    var done=0;
    files.forEach(function(f){
      comprimirImagen(f,function(b64){
        arr.push(b64); done++;
        if(done===files.length) renderFotosEn(gridId,zoneId,arr);
      });
    });
    input.value='';
  };
}

function renderFotosEn(gridId,zoneId,arr){
  var grid=document.getElementById(gridId); if(!grid)return;
  grid.innerHTML=arr.map(function(b64,i){
    return '<div class="foto-item"><img src="'+b64+'"><button class="foto-del" data-i="'+i+'" data-grid="'+gridId+'" data-zone="'+zoneId+'"><i class="ti ti-x"></i></button></div>';
  }).join('');
  grid.querySelectorAll('.foto-del').forEach(function(btn){
    btn.onclick=function(e){
      e.stopPropagation();
      var gi=this.getAttribute('data-grid');
      var zi=this.getAttribute('data-zone');
      // Determine which array
      var a=(gi==='fotoGrid')?fotos:fotosModal;
      a.splice(+this.getAttribute('data-i'),1);
      renderFotosEn(gi,zi,a);
    };
  });
  var zone=document.getElementById(zoneId);
  if(zone){var p=zone.querySelector('p');if(p)p.textContent=arr.length+'/3 fotos'+(arr.length<3?' - Agregar más':'');}
}

// Compress image to base64
function comprimirImagen(file, cb){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var MAX=800;
      var w=img.width, h=img.height;
      if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
      if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
      var canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg',0.6));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function agregarFotos(files){
  var restantes=3-fotos.length;
  if(restantes<=0){alert('Máximo 3 fotos por novedad.');return;}
  var arr=Array.from(files).slice(0,restantes);
  var procesadas=0;
  arr.forEach(function(f){
    comprimirImagen(f,function(b64){
      fotos.push(b64);
      procesadas++;
      if(procesadas===arr.length) renderFotos();
    });
  });
  document.getElementById('fotoInput').value='';
}

function renderFotos(){renderFotosEn('fotoGrid','fotoZone',fotos);}

async function enviar(){
  var t=document.getElementById('fT')?document.getElementById('fT').value.trim():'';
  var p=document.getElementById('fP')?document.getElementById('fP').value.trim().toUpperCase():'';
  var r=document.getElementById('fR')?document.getElementById('fR').value.trim():'';
  var cl=document.getElementById('fCl')?document.getElementById('fCl').value.trim():'';
  var ob=document.getElementById('fO')?document.getElementById('fO').value.trim():'';

  // Collect SKUs - only include rows that have SKU + producto + cantidad
  var skuItems=[];
  for(var si=1;si<=3;si++){
    var rowEl=document.getElementById('skuRow'+si);
    if(!rowEl) continue;
    var sv=document.getElementById('fS'+si)?document.getElementById('fS'+si).value.trim():'';
    var pv=document.getElementById('fPr'+si)?document.getElementById('fPr'+si).value.trim():'';
    var cv=document.getElementById('fC'+si)?document.getElementById('fC'+si).value.trim():'';
    if(sv&&pv&&cv) skuItems.push({sku:sv,producto:pv,cantidad:cv});
  }

  // First SKU for backward compatibility
  var s=skuItems.length?skuItems[0].sku:'';
  var pr=skuItems.length?skuItems[0].producto:'';
  var c=skuItems.length?skuItems[0].cantidad:'';

  var err=[];
  if(!t) err.push('N° Transporte');
  if(!p) err.push('Placa Vehículo');
  if(!r) err.push('Responsable de Ruta');
  if(!skuItems.length) err.push('SKU 1 (obligatorio) - ingresa código y cantidad');
  if(!cl) err.push('Cliente');
  if(!motivoSel) err.push('Motivo DQI');
  if(!cambioEntrega) err.push('¿Es para cambio y entrega? (Si o No)');
  if(err.length){alert('Campos faltantes:\n- '+err.join('\n- '));return;}
  var btn=document.getElementById('bEnv');
  btn.disabled=true; btn.innerHTML='<i class="ti ti-loader-2"></i> Enviando...';
  var sid=uid(), aprobador=getAprobador(motivoSel);
  try{
    await window._add(window._col(window._db,'novedades'),{
      id:sid,nTransporte:t,placa:p,responsable:r,
      sku:s,producto:pr,cantidad:c,
      skus:skuItems,
      cliente:cl,motivo:motivoSel,cambioEntrega:cambioEntrega,obs:ob,aprobador:aprobador,
      fotos:fotos,
      supervisorNombre:RL[role],supervisorUsername:role,
      fecha:ts(),estado:'pendiente',creadoEn:Date.now(),
      tl:[{a:'Novedad DQI reportada',por:(usuarioActual&&usuarioActual.nombre?usuarioActual.nombre:RL[role]),ts:ts(),
           n:'Motivo: '+motivoSel+' | Aprueba: '+RL[aprobador]+' | '+(cambioEntrega==='si'?'Con cambio y entrega':'Sin cambio')+' | '+cl+' | '+skuItems.map(function(x){return 'SKU:'+x.sku+' x'+x.cantidad;}).join(', '),
           c:'naranja'}]
    });
    var notifRoles=[aprobador];
    if(aprobador==='facturacion') notifRoles.push('bavaria');
    addN(notifRoles,'Nueva novedad de '+RL[role]+': '+cl+' | '+motivoSel+' | SKU '+s,sid);
    alert('Novedad enviada.\nReferencia: '+sid+'\nSer\u00e1 revisada por: '+RL[aprobador]);
    motivoSel=null; cambioEntrega=null; fotos=[];
    showV('dashboard');
  }catch(e){
    alert('Error: '+e.message);
    btn.disabled=false; btn.innerHTML='<i class="ti ti-send"></i> Enviar novedad';
  }
}

function filtrarPorPeriodo(arr){
  var hoy=new Date();
  var h=hoy.getFullYear()+'-'+String(hoy.getMonth()+1).padStart(2,'0')+'-'+String(hoy.getDate()).padStart(2,'0');
  var desde='', hasta=h;
  if(rdbPeriodo==='custom'){desde=rdbDesde;hasta=rdbHasta||h;}
  else if(rdbPeriodo==='hoy'){desde=h;hasta=h;}
  else if(rdbPeriodo==='semana'){var lu=new Date(hoy);lu.setDate(hoy.getDate()-hoy.getDay()+1);desde=lu.getFullYear()+'-'+String(lu.getMonth()+1).padStart(2,'0')+'-'+String(lu.getDate()).padStart(2,'0');}
  else if(rdbPeriodo==='mes'){desde=hoy.getFullYear()+'-'+String(hoy.getMonth()+1).padStart(2,'0')+'-01';}
  else return arr;
  return arr.filter(function(n){
    if(!n.creadoEn) return true;
    var d=new Date(n.creadoEn);
    var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    return ds>=desde && ds<=hasta;
  });
}

    var ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:12},{wch:20},{wch:18},{wch:10},{wch:14},{wch:20},{wch:8},{wch:25},{wch:8},{wch:18},{wch:12},{wch:18},{wch:30},{wch:15}];
    XLSX.utils.book_append_sheet(wb,ws,'Backup DQI');
    var fecha=new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb,'Bavaria_DQI_Backup_'+fecha+'.xlsx');
    mostrarToast('✅ Backup exportado: '+snap.docs.length+' registros');
  }).catch(function(e){
    mostrarToast('Error: '+e.message);
  });
}

function exportarExcel(){
  var data=filtrarPorPeriodo(novs);
  var rows=[['ID','Fecha','Responsable','Placa','N Transporte','Cliente','SKU','Producto','Cantidad','Motivo','Cambio y Entrega','Estado','Observaciones']];
  data.forEach(function(n){
    rows.push([
      n.id||n._id||'',n.fecha||'',n.responsable||n.supervisorNombre||'',n.placa||'',
      n.nTransporte||'',n.cliente||'',n.sku||'',n.producto||'',n.cantidad||'',
      n.motivo||(n.motivos&&n.motivos[0])||'',n.cambioEntrega==='si'?'Si':'No',
      EST_LABEL[n.estado]||n.estado||'',n.obs||''
    ]);
  });
  var wb=XLSX.utils.book_new();
  var ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:12},{wch:18},{wch:18},{wch:10},{wch:14},{wch:20},{wch:8},{wch:25},{wch:9},{wch:18},{wch:12},{wch:18},{wch:30}];
  XLSX.utils.book_append_sheet(wb,ws,'Novedades DQI');
  XLSX.writeFile(wb,'Bavaria_DQI_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

function cargarRango(desdeTs, cb){
  var q;
  if(desdeTs>0){
    q=window._q(window._col(window._db,'novedades'),window._where('creadoEn','>=',desdeTs),window._ord('creadoEn','desc'));
  } else {
    q=window._q(window._col(window._db,'novedades'),window._ord('creadoEn','desc'));
  }
  window._getDocs(q).then(function(snap){
    novs=snap.docs.map(function(d){
      var data=d.data();
      var light=Object.assign({},data,{_id:d.id});
      delete light.fotos; delete light.fotosOL; delete light.fotosEntrega;
      light._hasFotos=!!(data.fotos&&data.fotos.length||data.fotosOL&&data.fotosOL.length||data.fotosEntrega&&data.fotosEntrega.length);
      light._fotosLoaded=false;
      return light;
    });
    window._allNovs=novs;
    if(cb) cb();
  }).catch(function(e){
    mostrarToast('Error al cargar: '+e.message);
  });
}

function mostrarToast(msg){
  var t=document.getElementById('toastMsg');
  if(!t){
    t=document.createElement('div');
    t.id='toastMsg';
    t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:9999;transition:opacity 0.3s;white-space:nowrap';
    document.body.appendChild(t);
  }
  t.textContent=msg;
  t.style.opacity='1';
  clearTimeout(t._timer);
  t._timer=setTimeout(function(){t.style.opacity='0';},2500);
}

function toggleNotif(){
  var p=document.getElementById('notifPanel');
  if(p.style.display==='none'||!p.style.display){
    p.style.display='block';
    var list=myN();
    document.getElementById('notifList').innerHTML=list.length
      ?list.map(function(n){return '<div class="notif-item"><div class="notif-msg">'+n.msg+'</div><div class="notif-ts">'+n.ts+'</div></div>';}).join('')
      :'<div style="font-size:13px;color:var(--text2)">Sin notificaciones</div>';
    myN().forEach(function(n){n.read=true;}); saveN();
  }else p.style.display='none';
}

</script>

<!-- FOTO VIEWER -->
<div class="foto-viewer" id="fotoViewer">
  <button class="foto-viewer-close" id="fotoViewerClose"><i class="ti ti-x"></i></button>
  <img id="fotoViewerImg" src="" alt="">
  <div class="foto-viewer-nav">
    <button id="fotoViewerPrev"><i class="ti ti-arrow-left"></i> Anterior</button>
    <span id="fotoViewerCount" style="color:#fff;font-size:13px;align-self:center"></span>
    <button id="fotoViewerNext">Siguiente <i class="ti ti-arrow-right"></i></button>
  </div>
</div>

<script>
// Foto viewer logic
var viewerFotos=[], viewerIdx=0;

function abrirViewer(arr, idx){
  viewerFotos=arr; viewerIdx=idx;
  document.getElementById('fotoViewer').style.display='flex';
  mostrarFoto();
}

function mostrarFoto(){
  document.getElementById('fotoViewerImg').src=viewerFotos[viewerIdx];
  document.getElementById('fotoViewerCount').textContent=(viewerIdx+1)+' / '+viewerFotos.length;
  document.getElementById('fotoViewerPrev').style.display=viewerIdx>0?'block':'none';
  document.getElementById('fotoViewerNext').style.display=viewerIdx<viewerFotos.length-1?'block':'none';
}

document.getElementById('fotoViewerClose').onclick=function(){
  document.getElementById('fotoViewer').style.display='none';
};
document.getElementById('fotoViewerPrev').onclick=function(){
  if(viewerIdx>0){viewerIdx--;mostrarFoto();}
};
document.getElementById('fotoViewerNext').onclick=function(){
  if(viewerIdx<viewerFotos.length-1){viewerIdx++;mostrarFoto();}
};
document.getElementById('fotoViewer').onclick=function(e){
  if(e.target===this) this.style.display='none';
};
</script>
</body>
